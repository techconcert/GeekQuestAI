<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GeekQuestAI preview</title>
<style>
  :root { --bg:#14161d; --panel:#1e222d; --line:#333a4c; --ink:#e6e8ef; --dim:#8f97ab; --acc:#48be58; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 system-ui,sans-serif; }
  main { max-width:980px; margin:0 auto; padding:16px; display:grid; grid-template-columns:minmax(0,500px) minmax(0,1fr); gap:16px; }
  @media (max-width:820px) { main { grid-template-columns:1fr; } }
  h1 { font-size:18px; margin:0 0 4px; } h2 { font-size:13px; margin:14px 0 6px; color:var(--dim); text-transform:uppercase; letter-spacing:.06em; }
  p { margin:4px 0; color:var(--dim); }
  .screen { position:relative; width:100%; max-width:480px; aspect-ratio:1; border:10px solid #0b0c10; border-radius:14px; background:#000; }
  canvas { position:absolute; inset:0; width:100%; height:100%; image-rendering:pixelated; }
  .box { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 12px; }
  .row { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin:6px 0; }
  button, select, input[type=number] { background:#2a3040; color:var(--ink); border:1px solid var(--line); border-radius:6px; padding:5px 9px; font:inherit; }
  button { cursor:pointer; } button:hover { border-color:var(--acc); }
  button[aria-pressed=true] { background:var(--acc); color:#08130a; border-color:var(--acc); }
  input[type=range] { flex:1; min-width:120px; }
  label { display:inline-flex; gap:5px; align-items:center; }
  dl { display:grid; grid-template-columns:auto 1fr; gap:2px 12px; margin:0; font-variant-numeric:tabular-nums; }
  dt { color:var(--dim); } dd { margin:0; }
</style>
</head>
<body>
<main>
  <section>
    <h1>GeekQuestAI preview</h1>
    <p>The same game core the clock runs, compiled to WebAssembly (<span id="wasm-size"></span>). It plays by itself; the buttons only poke it.</p>
    <div class="screen"><canvas id="lcd" width="240" height="240"></canvas></div>
    <h2>Time</h2>
    <div class="box">
      <div class="row" id="speed">
        <button data-v="0">Pause</button><button data-v="1" aria-pressed="true">1x</button><button data-v="10">10x</button><button data-v="60">60x</button><button data-v="300">300x</button>
      </div>
      <div class="row"><label><input type="checkbox" id="time-live" checked> real time</label>
        <input type="range" id="time" min="0" max="1439" value="600"><b id="time-label">--:--</b></div>
      <div class="row"><button id="day-next">Next day</button><button id="restart">Restart game</button>
        <label>scene <select id="scene"><option value="1">Game</option><option value="0">Display test</option><option value="2">Safe mode text</option></select></label></div>
    </div>
  </section>
  <section>
    <h2>Make something happen</h2>
    <div class="box">
      <div class="row"><button id="b-truck">Delivery truck</button><button id="b-water">Water plant fails</button>
        <button id="b-card">Show info card</button></div>
      <div class="row"><select id="robot"><option value="0">Crate-bot</option><option value="1">Sweeper</option><option value="2">Cable-spider</option><option value="3">Roof drone</option></select>
        <button id="b-glitch">goes rogue</button></div>
      <div class="row"><select id="mission"><option value="1">Cooling loop</option><option value="2">Solar build</option><option value="3">Storm repair</option><option value="4">Fiber hunt</option><option value="5">Robot uprising</option></select>
        <input type="number" id="m-seed" placeholder="seed" style="width:90px"><button id="b-mission">Start mission</button><button id="b-lastroom">Jump to last room</button></div>
      <div class="row"><button id="b-rack1">+1 rack</button><button id="b-rack10">+10 racks</button><button id="b-panel3">+3 solar panels</button></div>
      <div class="row"><select id="area"><option value="0">Server hall</option><option value="1">Network room</option><option value="2">Loading dock</option><option value="3">Water plant</option><option value="4">Roof</option><option value="5">Office</option><option value="6">Hardware store</option></select>
        <button id="b-goto">Put him there</button></div>
      <div class="row"><select id="job"><option value="1">Rounds</option><option value="2">Coffee and desk</option><option value="1027">Check the roof</option><option value="771">Check the pumps</option><option value="4">Clean panels</option><option value="262">Fire drill</option><option value="518">Coffee maker broke</option><option value="774">Power blip</option><option value="5">Shop: a server</option><option value="261">Shop: racks</option><option value="517">Shop: chips</option><option value="773">Shop: cables</option><option value="1029">Shop: a solar panel</option></select>
        <button id="b-job">Do it now</button></div>
    </div>
    <h2>Weather, sleep, network</h2>
    <div class="box">
      <div class="row"><select id="lw-wx"><option value="-1">no reading</option><option value="0" selected>clear</option><option value="1">cloudy</option><option value="2">rain</option><option value="3">storm</option><option value="4">fog</option><option value="5">snow</option><option value="6">windy</option></select>
        <input type="number" id="lw-temp" value="23.5" step="0.5" style="width:80px"> C
        <label><input type="checkbox" id="lw-f"> show F</label><label><input type="checkbox" id="lw-night"> night icon</label></div>
      <div class="row"><label>sleep <select id="sleep-mode"><option value="0">built-in night 22:00 to 06:00</option><option value="1">schedule: stay up</option><option value="2">schedule: sleep now</option></select></label></div>
      <div class="row"><label>info card every <input type="number" id="card-period" value="10" min="0" max="255" style="width:70px"> min</label>
        <label><input type="checkbox" id="wifi-down"> WiFi down</label><label><input type="checkbox" id="clock-off"> no clock</label></div>
      <div class="row"><label>colour depth <input type="range" id="depth" min="0" max="100" value="40"><span id="depth-label">40</span></label></div>
    </div>
    <h2>State</h2>
    <div class="box"><dl id="readout"></dl></div>
  </section>
</main>

    env();
    ex.set_depth(+$("depth").value);
  }
  function blit(strip) {
    ex.render(strip);
    const px = new Uint16Array(mem.buffer, ex.strip_ptr(), 240 * 16), d = img.data;
    let o = strip * 240 * 16 * 4;
    for (let i = 0; i < px.length; i++) {
      const c = px[i], r = (c >> 11) & 31, g = (c >> 5) & 63, b = c & 31;
      d[o++] = (r << 3) | (r >> 2); d[o++] = (g << 2) | (g >> 4); d[o++] = (b << 3) | (b >> 2); d[o++] = 255;
    }
  }
  const realMinutes = () => { const n = new Date(); return n.getHours() * 60 + n.getMinutes() + n.getSeconds() / 60; };
  const useReal = () => $("time-live").checked && speed === 1;
  let roAcc = 0, lastDay = "";
  function frame(now) {
    const dt = Math.min(250, now - last);
    last = now;
    const total = dt * speed;
    if (!useReal()) vmin = (vmin + total / 60000) % 1440;
    const steps = speed > 0 ? Math.min(400, Math.max(1, Math.ceil(total / 100))) : 0;
    for (let i = 0; i < steps; i++) {
      const m = Math.floor(useReal() ? realMinutes() : (vmin - total / 60000 * (1 - (i + 1) / steps) + 1440) % 1440) % 1440;
      ex.set_clock(Math.floor(m / 60), m % 60, $("clock-off").checked ? 0 : 1);
      ex.tick(total / steps);
    }
    const m = Math.floor(useReal() ? realMinutes() : vmin) % 1440;
    $("time-label").textContent = pad2(Math.floor(m / 60)) + ":" + pad2(m % 60);
    if (!useReal()) $("time").value = m;
    if (scene === 1) {
      const d = new Date(Date.now() + (ex.query(Q.DAY) - 1) * 86400000), key = d.toDateString();
      if (key !== lastDay) { lastDay = key; ex.set_date(d.getFullYear(), d.getMonth() + 1, d.getDate(), d.getDay()); }
    }
    const mask = ex.dirty();
    let n = 0;
    for (let s = 0; s < 15; s++) if (mask & (1 << s)) { blit(s); n++; }
    ex.clear_dirty();
    if (n) lcd.putImageData(img, 0, 0);
    roAcc += dt;
    if (roAcc > 400 && scene === 1) {
      roAcc = 0;
      for (const k of READ) {
        let v = ex.query(Q[k]);
        if (k === "MINUTE") v = pad2(Math.floor(v / 60)) + ":" + pad2(v % 60);
        else if (k === "TLOPS") v = v + " T";
        else if (NAMES[k]) v = NAMES[k][v] !== undefined ? NAMES[k][v] : v;
        cells[k].textContent = v;
      }
    }
    requestAnimationFrame(frame);
  }
  const dbg = (cmd, arg) => ex.debug(cmd, arg | 0);
  function wire() {
    $("speed").addEventListener("click", (e) => {
      const b = e.target.closest("button"); if (!b) return;
      $("speed").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b ? "true" : "false"));
      if (+b.dataset.v !== 1 && useReal()) vmin = realMinutes();
      speed = +b.dataset.v;
    });
    $("time").addEventListener("input", () => { $("time-live").checked = false; vmin = +$("time").value; });
    $("time-live").addEventListener("change", () => { if (!$("time-live").checked) vmin = realMinutes(); });
    $("scene").addEventListener("change", () => start(+$("scene").value));
    $("restart").addEventListener("click", () => start(scene));
    $("day-next").addEventListener("click", () => dbg(DBG.NEXT_DAY, 0));
    $("b-truck").addEventListener("click", () => dbg(DBG.DELIVERY, 0));
    $("b-water").addEventListener("click", () => dbg(DBG.WATER_DOWN, 0));
    $("b-card").addEventListener("click", () => dbg(DBG.SHOW_CARD, 0));
    $("b-glitch").addEventListener("click", () => dbg(DBG.GLITCH, +$("robot").value));
    $("b-mission").addEventListener("click", () => dbg(DBG.MISSION, (((+$("m-seed").value | 0) & 0xFFFFFF) << 3) | +$("mission").value));
    $("b-lastroom").addEventListener("click", () => dbg(DBG.MISSION_ROOM, ex.query(Q.MISSION_ROOMS) - 1));
    $("b-rack1").addEventListener("click", () => dbg(DBG.ADD_RACKS, 1));
    $("b-rack10").addEventListener("click", () => dbg(DBG.ADD_RACKS, 10));
    $("b-panel3").addEventListener("click", () => dbg(DBG.ADD_PANELS, 3));
    $("b-goto").addEventListener("click", () => dbg(DBG.GOTO, +$("area").value));
    $("b-job").addEventListener("click", () => dbg(DBG.FORCE_JOB, +$("job").value));
    ["lw-wx", "lw-temp", "lw-f", "lw-night", "sleep-mode", "card-period", "wifi-down"].forEach((id) => $(id).addEventListener("change", env));
    setInterval(() => { if (scene === 1) env(); }, 1000);
    $("depth").addEventListener("input", () => { $("depth-label").textContent = $("depth").value; ex.set_depth(+$("depth").value); });
  }
  WebAssembly.instantiate(bytes, {}).then(({ instance }) => {
    ex = instance.exports; mem = ex.memory;
    wire();
    start(1);
    requestAnimationFrame(frame);
  });
})();
</script>
